services:
  # ============================================================================
  # 1. SQL Server Database Engine
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: contractmgmt-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd_ChangeMe123!}"
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd_ChangeMe123!}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - contractmgmt-network

  # ============================================================================
  # 2. Database Schema Initializer (Runs database.sql if ContractDb is missing)
  # ============================================================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: contractmgmt-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database.sql:/scripts/database.sql:ro
      - ./scripts/init-db.sh:/scripts/init-db.sh:ro
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    environment:
      DB_HOST: "sqlserver"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd_ChangeMe123!}"
    networks:
      - contractmgmt-network

  # ============================================================================
  # 3. ASP.NET Core Backend API (.NET 10)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contractmgmt-backend
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://+:5028"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ContractDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd_ChangeMe123!};TrustServerCertificate=True;MultipleActiveResultSets=True;"
    ports:
      - "${BACKEND_PORT:-5028}:5028"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5028/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - contractmgmt-network

  # ============================================================================
  # 4. React 19 Frontend Web (Nginx Reverse Proxy on port 5173)
  # ============================================================================
  frontend:
    build:
      context: ./ContractManagement-Frontend
      dockerfile: Dockerfile
    container_name: contractmgmt-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - contractmgmt-network

volumes:
  sqlserver_data:
    name: contractmgmt_sqlserver_data

networks:
  contractmgmt-network:
    name: contractmgmt-network
    driver: bridge
